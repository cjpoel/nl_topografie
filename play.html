<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Topografie – Spelen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <h1 id="pageTitle">Topografie</h1>

    <div class="grid game-grid">
      <div class="card">
        <canvas id="map"></canvas>
        <div class="small" style="margin-top:10px;">
          <a href="index.html">← terug naar menu</a>
          <span> • </span>
          Tip: selectie + highscores blijven bewaard op dit apparaat.
        </div>
      </div>

      <div class="card col controls">
        <div class="row">
          <button id="mode1" class="primary">Modus 1: klik</button>
          <button id="mode2">Modus 2: typ</button>
        </div>

        <div class="prompt" id="prompt">Laden…</div>

        <div id="typingArea" class="row" style="display:none;">
          <input id="answer" type="text" placeholder="Typ de plaatsnaam…" autocomplete="off" />
          <button id="check" class="primary">Controleer</button>
          <button id="skip">Sla over</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="stats">
          <div class="pill">Tijd: <span id="time">0:00</span></div>
          <div class="pill">Goed: <span id="good">0</span></div>
          <div class="pill">Fout: <span id="bad">0</span></div>
          <div class="pill">Totaal: <span id="total">0</span></div>
          <div class="pill">Reeks: <span id="streak">0</span></div>
        </div>

        <div class="divider"></div>

        <div class="row">
          <button id="next" class="primary" disabled>Volgende</button>
          <button id="repeatWrong" disabled>Oefen foutjes</button>
          <button id="highscores">Highscores</button>
          <button id="reset">Reset</button>
        </div>

        <div class="divider"></div>

        <div>
          <div class="row" style="justify-content:space-between;">
            <b>Provincies in toets</b>
            <span class="tag" id="activeCount">0 plaatsen</span>
          </div>
          <div class="chklist" id="provinceList"></div>
          <div class="row" style="margin-top:10px;">
            <button id="selectAll">Alles</button>
            <button id="startTest" class="primary">Start toets</button>
          </div>
        </div>

        <div class="small" style="margin-top:10px;">
          Dataset: <code id="datasetCode">?</code>
        </div>
      </div>
    </div>
  </div>

  <!-- Highscore modal -->
  <div id="modalBackdrop" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <b>🏆 Highscores</b>
        <button id="closeModal">Sluiten</button>
      </div>
      <div class="small" id="hsSubtitle" style="margin-top:6px;"></div>
      <div class="divider"></div>
      <div id="hsContent" class="small"></div>
    </div>
  </div>

  <script type="module">
    // ⬇️ Verhoog deze als je JS wijzigt (engine/datasets). Dit bust de cache.
    const APP_VERSION = "v1.1.2";

    const params = new URLSearchParams(location.search);
    const set = params.get("set") || "noord";

    // Engine met cache-buster
    const { TopoEngine } = await import(`./engine.js?v=${encodeURIComponent(APP_VERSION)}`);

    // Dataset met cache-buster
    const datasetModule = await import(`./datasets/${set}.js?v=${encodeURIComponent(APP_VERSION)}`);
    const dataset = datasetModule.DATASET;

    document.getElementById("pageTitle").textContent = dataset.title;
    document.getElementById("datasetCode").textContent = dataset.id;

    new TopoEngine(dataset).mount();
  </script>
</body>
</html>
