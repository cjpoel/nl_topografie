<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Topografie – Zuid-Nederland</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f6f7fb; color: #111; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .row { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) { .row { grid-template-columns: 2fr 1fr; } }

    .card {
      background: #fff; border-radius: 14px; padding: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
    }

    .controls { display: grid; gap: 10px; }
    .controls .mode { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, input[type="text"] {
      font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid #d7dbe7;
      background: #fff;
    }
    button { cursor: pointer; }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .prompt {
      font-size: 16px; padding: 10px 12px; border-radius: 12px;
      background: #f1f3ff; border: 1px solid #dfe3ff;
    }
    .feedback { font-weight: 700; min-height: 22px; }
    .good { color: #0a7a2f; }
    .bad { color: #b00020; }

    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { background: #f2f4fa; border: 1px solid #e3e7f5; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
    .hr { height: 1px; background: #eef1fb; margin: 10px 0; }
    .small { font-size: 12px; color: #444; line-height: 1.4; }

    canvas { width: 100%; height: auto; border-radius: 14px; background: #e9ecf6; touch-action: manipulation; }
    #typingArea { display:none; gap:8px; align-items:center; flex-wrap:wrap; }
    a { color:#111; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Topografie – Zuid-Nederland (Utrecht • Noord-Brabant • Limburg)</h1>

  <div class="row">
    <div class="card">
      <canvas id="map" width="1250" height="1212"></canvas>
      <div class="small" style="margin-top:10px;">
        <a href="index.html">← terug naar menu</a>
        <span> • </span>
        Modus 1: klik dicht bij de juiste stip. Modus 2: typ de naam.
      </div>
    </div>

    <div class="card controls">
      <div class="mode">
        <button id="mode1" class="primary">Modus 1: klik</button>
        <button id="mode2">Modus 2: typ</button>
      </div>

      <div class="prompt" id="prompt">Laden…</div>

      <div id="typingArea">
        <input id="answer" type="text" placeholder="Typ de plaatsnaam…" autocomplete="off" />
        <button id="check" class="primary">Controleer</button>
        <button id="skip">Sla over</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="stats">
        <div class="pill">Goed: <span id="good">0</span></div>
        <div class="pill">Fout: <span id="bad">0</span></div>
        <div class="pill">Totaal: <span id="total">0</span></div>
        <div class="pill">Reeks: <span id="streak">0</span></div>
      </div>

      <div class="hr"></div>

      <button id="next" class="primary">Volgende</button>
      <button id="repeatWrong">Oefen foutjes</button>
      <button id="reset">Reset</button>

      <div class="small">
        Bestanden: <code>zuid.html</code> + <code>zuid_schoon3.png</code>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ======= CONFIG =======
  const MAP_IMAGE = "zuid_schoon3.png";
  const SHOW_ALL_DOTS = true;

  // “Voelt” overal hetzelfde (scherm-pixels)
  const DOT_SCREEN_PX  = 14;   // diameter stip op scherm
  const RING_SCREEN_PX = 34;   // diameter ring op scherm
  const HIT_SCREEN_PX  = 40;   // klikmarge op scherm

  // Auto door na antwoord (pas dit gerust aan)
  const DELAY_GOOD_MS = 900;
  const DELAY_BAD_MS  = 1600;

  // ======= DATA =======
  // Coördinaten gebaseerd op jouw stippen (kaart: 1250 x 1212).
  const PLACES = [
    // Utrecht
    { name: "Utrecht",     x: 683.4,  y: 348.6 },
    { name: "Amersfoort",  x: 774.6,  y: 311.4 },

    // Noord-Brabant
    { name: "Bergen op Zoom",   x: 450.6,  y: 666.6 },
    { name: "Roosendaal",       x: 558.6,  y: 636.6 },
    { name: "Breda",            x: 670.2,  y: 653.4 },
    { name: "'s-Hertogenbosch", x: 821.4,  y: 534.6 },
    { name: "Tilburg",          x: 747.0,  y: 573.0 },
    { name: "Oss",              x: 975.0,  y: 534.6 },
    { name: "Eindhoven",        x: 807.0,  y: 719.4 },
    { name: "Helmond",          x: 915.0,  y: 705.0 },

    // Limburg
    { name: "Venlo",      x: 1050.6, y: 759.0 },
    { name: "Roermond",   x: 987.0,  y: 857.4 },
    { name: "Maastricht", x: 881.4,  y: 1051.8 },
    { name: "Heerlen",    x: 984.6,  y: 1033.8 },
  ];

  // ======= UI =======
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");

  const promptEl = document.getElementById("prompt");
  const feedbackEl = document.getElementById("feedback");
  const goodEl = document.getElementById("good");
  const badEl = document.getElementById("bad");
  const totalEl = document.getElementById("total");
  const streakEl = document.getElementById("streak");

  const mode1Btn = document.getElementById("mode1");
  const mode2Btn = document.getElementById("mode2");

  const typingArea = document.getElementById("typingArea");
  const answerInput = document.getElementById("answer");
  const checkBtn = document.getElementById("check");
  const skipBtn = document.getElementById("skip");

  const nextBtn = document.getElementById("next");
  const resetBtn = document.getElementById("reset");
  const repeatWrongBtn = document.getElementById("repeatWrong");

  // ======= STATE =======
  let mode = 1;
  let current = null;
  let scoreGood = 0, scoreBad = 0, scoreTotal = 0;
  let streak = 0;

  let deck = [];
  let wrongPile = [];

  // ======= IMAGE (cache-buster) =======
  const img = new Image();
  img.src = addCacheBuster(MAP_IMAGE);
  img.onload = () => { draw(); newRound(); };

  function addCacheBuster(url) {
    const v = "v=20260224";
    return url + (url.includes("?") ? "&" : "?") + v;
  }

  // ======= SCALE HELPERS =======
  function screenScale() {
    const rect = canvas.getBoundingClientRect();
    return rect.width / canvas.width;
  }
  function dotRadiusCanvasPx() {
    return Math.max(3, (DOT_SCREEN_PX / 2) / screenScale());
  }
  function ringRadiusCanvasPx() {
    return Math.max(10, (RING_SCREEN_PX / 2) / screenScale());
  }
  function hitRadiusCanvasPx() {
    return Math.max(10, (HIT_SCREEN_PX / 2) / screenScale());
  }

  // ======= DECK =======
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function nextPlace() {
    if (deck.length === 0) deck = shuffle([...PLACES]);
    return deck.pop();
  }

  // ======= HELPERS =======
  function updateScore() {
    goodEl.textContent = scoreGood;
    badEl.textContent = scoreBad;
    totalEl.textContent = scoreTotal;
    streakEl.textContent = streak;
  }
  function normalize(s) {
    return (s || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/\p{Diacritic}/gu, "");
  }
  function levenshtein(a, b) {
    a = normalize(a); b = normalize(b);
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
    for (let i=0;i<=m;i++) dp[i][0]=i;
    for (let j=0;j<=n;j++) dp[0][j]=j;
    for (let i=1;i<=m;i++){
      for (let j=1;j<=n;j++){
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + cost);
      }
    }
    return dp[m][n];
  }
  function isCloseAnswer(input, target) {
    const a = normalize(input);
    const t = normalize(target);
    if (!a) return false;
    if (a === t) return true;
    const d = levenshtein(a, t);
    const allowed = t.length <= 6 ? 1 : 2;
    return d <= allowed;
  }
  function setFeedback(text, ok) {
    feedbackEl.textContent = text || "";
    feedbackEl.className = "feedback " + (ok === true ? "good" : ok === false ? "bad" : "");
  }
  function fromClientToImageCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);
    return { x, y };
  }
  function nearestPlace(x, y) {
    let best = null, bestDist = Infinity;
    for (const p of PLACES) {
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < bestDist) { bestDist = d; best = p; }
    }
    return { place: best, dist: bestDist };
  }

  // ======= DRAW =======
  function drawDot(x, y, r, style) {
    ctx.beginPath();
    ctx.fillStyle = style;
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawRing(x, y, r, style) {
    ctx.beginPath();
    ctx.strokeStyle = style;
    ctx.lineWidth = Math.max(2, 6 / screenScale());
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const DOT_R = dotRadiusCanvasPx();

    if (SHOW_ALL_DOTS) {
      for (const p of PLACES) drawDot(p.x, p.y, DOT_R, "rgba(0,0,0,0.30)");
    }

    if (current && mode === 2) {
      const RING_R = ringRadiusCanvasPx();
      drawRing(current.x, current.y, RING_R, "rgba(255, 0, 0, 0.90)");
      drawDot(current.x, current.y, DOT_R, "rgba(255,0,0,0.90)");
    }
  }

  // ======= GAME =======
  function newRound() {
    current = nextPlace();
    setFeedback("", null);

    if (mode === 1) {
      promptEl.textContent = `Klik op: ${current.name}`;
      typingArea.style.display = "none";
    } else {
      promptEl.textContent = `Welke plaats is dit? (typ de naam)`;
      typingArea.style.display = "flex";
      answerInput.value = "";
      answerInput.focus();
    }
    draw();
  }

  function setMode(m) {
    mode = m;
    if (mode === 1) {
      mode1Btn.classList.add("primary");
      mode2Btn.classList.remove("primary");
    } else {
      mode2Btn.classList.add("primary");
      mode1Btn.classList.remove("primary");
    }
    newRound();
  }

  mode1Btn.addEventListener("click", () => setMode(1));
  mode2Btn.addEventListener("click", () => setMode(2));
  nextBtn.addEventListener("click", () => newRound());

  repeatWrongBtn.addEventListener("click", () => {
    if (wrongPile.length === 0) {
      setFeedback("Geen foutjes om te oefenen 🙂", true);
      return;
    }
    deck = shuffle([...wrongPile]);
    wrongPile = [];
    setFeedback("Oefen foutjes!", true);
    newRound();
  });

  resetBtn.addEventListener("click", () => {
    scoreGood = scoreBad = scoreTotal = 0;
    streak = 0;
    deck = [];
    wrongPile = [];
    updateScore();
    setFeedback("", null);
    newRound();
  });

  // ======= MODE 1: CLICK (pointerup) =======
  canvas.addEventListener("pointerup", (e) => {
    if (mode !== 1 || !current) return;
    e.preventDefault();

    const { x, y } = fromClientToImageCoords(e.clientX, e.clientY);
    const { place, dist } = nearestPlace(x, y);

    if (dist > hitRadiusCanvasPx()) {
      setFeedback("Klik iets dichter bij een stip 🙂", false);
      streak = 0;
      updateScore();
      return;
    }

    scoreTotal++;

    if (place.name === current.name) {
      scoreGood++;
      streak++;
      setFeedback("✅ Goed!", true);
      updateScore();
      setTimeout(newRound, DELAY_GOOD_MS);
    } else {
      scoreBad++;
      streak = 0;
      wrongPile.push(current);
      setFeedback(`❌ Fout. Dat was ${place.name}. (Goed: ${current.name})`, false);
      updateScore();
      setTimeout(newRound, DELAY_BAD_MS);
    }
  }, { passive:false });

  // ======= MODE 2: TYPE =======
  function checkTyped() {
    if (mode !== 2 || !current) return;

    scoreTotal++;
    const ok = isCloseAnswer(answerInput.value, current.name);

    if (ok) {
      scoreGood++;
      streak++;
      setFeedback("✅ Goed!", true);
      updateScore();
      setTimeout(newRound, DELAY_GOOD_MS);
    } else {
      scoreBad++;
      streak = 0;
      wrongPile.push(current);
      setFeedback(`❌ Fout. Goed was: ${current.name}.`, false);
      updateScore();
      setTimeout(newRound, DELAY_BAD_MS);
    }
  }

  function skipTyped() {
    if (mode !== 2 || !current) return;
    streak = 0;
    wrongPile.push(current);
    setFeedback(`⏭️ Overgeslagen. Dit was: ${current.name}.`, false);
    updateScore();
    setTimeout(newRound, DELAY_BAD_MS);
  }

  checkBtn.addEventListener("click", checkTyped);
  skipBtn.addEventListener("click", skipTyped);
  answerInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkTyped();
  });

  window.addEventListener("resize", () => { if (img.complete) draw(); });
})();
</script>
</body>
</html>
