<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Topografie – Oost-Nederland</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f6f7fb; color: #111; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .row { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) { .row { grid-template-columns: 2fr 1fr; } }

    .card {
      background: #fff; border-radius: 14px; padding: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
    }

    .controls { display: grid; gap: 10px; }
    .controls .mode { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, input[type="text"] {
      font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid #d7dbe7;
      background: #fff;
    }
    button { cursor: pointer; }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .prompt {
      font-size: 16px; padding: 10px 12px; border-radius: 12px;
      background: #f1f3ff; border: 1px solid #dfe3ff;
    }
    .feedback { font-weight: 700; min-height: 22px; }
    .good { color: #0a7a2f; }
    .bad { color: #b00020; }

    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { background: #f2f4fa; border: 1px solid #e3e7f5; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
    .hr { height: 1px; background: #eef1fb; margin: 10px 0; }
    .small { font-size: 12px; color: #444; line-height: 1.4; }

    canvas { width: 100%; height: auto; border-radius: 14px; background: #e9ecf6; }
    #typingArea { display:none; gap:8px; align-items:center; flex-wrap:wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Topografie – Oost-Nederland (Flevoland • Overijssel • Gelderland)</h1>

  <div class="row">
    <div class="card">
      <canvas id="map" width="1800" height="1260"></canvas>
      <div class="small" style="margin-top:10px;">
        Modus 1: klik dicht bij de juiste stip. Modus 2: typ de naam. Elke plaats komt 1× per ronde voorbij.
      </div>
      <div class="small" style="margin-top:8px;">
        <a href="index.html">← terug naar menu</a>
      </div>
    </div>

    <div class="card controls">
      <div class="mode">
        <button id="mode1" class="primary">Modus 1: klik op plaats</button>
        <button id="mode2">Modus 2: typ de naam</button>
      </div>

      <div class="prompt" id="prompt">Laden…</div>

      <div id="typingArea">
        <input id="answer" type="text" placeholder="Typ de plaatsnaam…" autocomplete="off" />
        <button id="check" class="primary">Controleer</button>
        <button id="skip">Sla over</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="stats">
        <div class="pill">Goed: <span id="good">0</span></div>
        <div class="pill">Fout: <span id="bad">0</span></div>
        <div class="pill">Totaal: <span id="total">0</span></div>
      </div>

      <div class="hr"></div>

      <button id="next" class="primary">Volgende</button>
      <button id="reset">Reset score</button>

      <div class="small">
        Bestanden in dezelfde map: <code>oost.html</code> en <code>oost_schoon4.png</code>.
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ======= KAART / DATA =======
  const MAP_IMAGE = "oost_schoon4.png";
  const HIT_RADIUS_PX = 20;     // iets ruimer, werkt fijn op iPad
  const SHOW_ALL_DOTS = true;

  // Coördinaten zijn uit jouw stippen gehaald (kaart 1800x1260).
  const PLACES = [
    // Flevoland
    { name: "Emmeloord", x: 502.5,  y: 106.5 },
    { name: "Lelystad",  x: 244.5,  y: 380.5 },
    { name: "Almere",    x: 88.5,   y: 588.5 },

    // Overijssel
    { name: "Kampen",    x: 630.6,  y: 306.5 },
    { name: "Zwolle",    x: 772.5,  y: 360.5 },
    { name: "Deventer",  x: 828.5,  y: 690.5 },
    { name: "Almelo",    x: 1216.6, y: 560.5 },
    { name: "Hengelo",   x: 1320.6, y: 676.5 },
    { name: "Enschede",  x: 1400.6, y: 738.5 },

    // Gelderland
    { name: "Apeldoorn",  x: 674.5,  y: 748.5 },
    { name: "Zutphen",    x: 856.5,  y: 840.5 },
    { name: "Arnhem",     x: 924.5,  y: 1060.5 },
    { name: "Wageningen", x: 438.5,  y: 1054.5 },
    { name: "Doetinchem", x: 630.5,  y: 1040.5 },
    { name: "Nijmegen",   x: 584.5,  y: 1216.5 },
  ];

  // ======= UI =======
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");

  const promptEl = document.getElementById("prompt");
  const feedbackEl = document.getElementById("feedback");
  const goodEl = document.getElementById("good");
  const badEl = document.getElementById("bad");
  const totalEl = document.getElementById("total");

  const mode1Btn = document.getElementById("mode1");
  const mode2Btn = document.getElementById("mode2");

  const typingArea = document.getElementById("typingArea");
  const answerInput = document.getElementById("answer");
  const checkBtn = document.getElementById("check");
  const skipBtn = document.getElementById("skip");

  const nextBtn = document.getElementById("next");
  const resetBtn = document.getElementById("reset");

  // ======= GAME STATE =======
  let mode = 1; // 1 = klik op stip op basis van naam, 2 = typ naam op basis van aangewezen stip
  let current = null;
  let scoreGood = 0, scoreBad = 0, scoreTotal = 0;

  // ======= “DECK” (shuffle-bag): iedereen 1× per ronde =======
  let deck = [];
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function nextPlace() {
    if (deck.length === 0) deck = shuffle([...PLACES]);
    return deck.pop();
  }

  // ======= IMAGE =======
  const img = new Image();
  img.src = MAP_IMAGE;
  img.onload = () => { draw(); newRound(); };

  // ======= HELPERS =======
  function updateScore() {
    goodEl.textContent = scoreGood;
    badEl.textContent = scoreBad;
    totalEl.textContent = scoreTotal;
  }

  function normalize(s) {
    return (s || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/\p{Diacritic}/gu, "");
  }

  function levenshtein(a, b) {
    a = normalize(a); b = normalize(b);
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
    for (let i=0;i<=m;i++) dp[i][0]=i;
    for (let j=0;j<=n;j++) dp[0][j]=j;
    for (let i=1;i<=m;i++){
      for (let j=1;j<=n;j++){
        const cost = a[i-1]===b[j-1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + cost);
      }
    }
    return dp[m][n];
  }

  function isCloseAnswer(input, target) {
    const a = normalize(input);
    const t = normalize(target);
    if (!a) return false;
    if (a === t) return true;
    const d = levenshtein(a, t);
    const allowed = t.length <= 6 ? 1 : 2;
    return d <= allowed;
  }

  function fromClientToImageCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);
    return { x, y };
  }

  function nearestPlace(x, y) {
    let best = null, bestDist = Infinity;
    for (const p of PLACES) {
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < bestDist) { bestDist = d; best = p; }
    }
    return { place: best, dist: bestDist };
  }

  // ======= DRAWING =======
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    if (SHOW_ALL_DOTS) {
      for (const p of PLACES) drawDot(p.x, p.y, 8, "rgba(0,0,0,0.30)");
    }

    if (current && mode === 2) {
      drawRing(current.x, current.y, 22, "rgba(255, 0, 0, 0.90)");
      drawDot(current.x, current.y, 8, "rgba(255,0,0,0.90)");
    }
  }

  function drawDot(x, y, r, style) {
    ctx.beginPath();
    ctx.fillStyle = style;
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRing(x, y, r, style) {
    ctx.beginPath();
    ctx.strokeStyle = style;
    ctx.lineWidth = 6;
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function setFeedback(text, ok) {
    feedbackEl.textContent = text || "";
    feedbackEl.className = "feedback " + (ok === true ? "good" : ok === false ? "bad" : "");
  }

  // ======= ROUNDS =======
  function newRound() {
    current = nextPlace();
    setFeedback("", null);

    if (mode === 1) {
      promptEl.textContent = `Klik op: ${current.name}`;
      typingArea.style.display = "none";
    } else {
      promptEl.textContent = `Welke plaats is dit? (typ de naam)`;
      typingArea.style.display = "flex";
      answerInput.value = "";
      answerInput.focus();
    }
    draw();
  }

  function setMode(m) {
    mode = m;
    if (mode === 1) {
      mode1Btn.classList.add("primary");
      mode2Btn.classList.remove("primary");
    } else {
      mode2Btn.classList.add("primary");
      mode1Btn.classList.remove("primary");
    }
    newRound();
  }

  mode1Btn.addEventListener("click", () => setMode(1));
  mode2Btn.addEventListener("click", () => setMode(2));
  nextBtn.addEventListener("click", () => newRound());
  resetBtn.addEventListener("click", () => {
    scoreGood = scoreBad = scoreTotal = 0;
    deck = [];
    updateScore();
    newRound();
  });

  // ======= MODE 1: CLICK ANSWER =======
  canvas.addEventListener("click", (e) => {
    if (mode !== 1 || !current) return;

    const { x, y } = fromClientToImageCoords(e.clientX, e.clientY);
    const { place, dist } = nearestPlace(x, y);

    if (dist > HIT_RADIUS_PX) {
      setFeedback("Klik iets dichter bij een stip 🙂", false);
      return;
    }

    scoreTotal++;
    if (place.name === current.name) {
      scoreGood++;
      setFeedback(`✅ Goed!`, true);
    } else {
      scoreBad++;
      setFeedback(`❌ Fout. Dat was ${place.name}. (Goed: ${current.name})`, false);
      draw();
      drawRing(current.x, current.y, 22, "rgba(0, 160, 0, 0.90)");
      drawDot(current.x, current.y, 8, "rgba(0,160,0,0.90)");
    }
    updateScore();
  });

  // ======= MODE 2: TYPE ANSWER =======
  function checkTyped() {
    if (mode !== 2 || !current) return;

    scoreTotal++;
    const ok = isCloseAnswer(answerInput.value, current.name);

    if (ok) {
      scoreGood++;
      setFeedback(`✅ Goed!`, true);
    } else {
      scoreBad++;
      setFeedback(`❌ Fout. Goed was: ${current.name}.`, false);
      draw();
      drawRing(current.x, current.y, 22, "rgba(0, 160, 0, 0.90)");
      drawDot(current.x, current.y, 8, "rgba(0,160,0,0.90)");
    }
    updateScore();
  }

  function skipTyped() {
    if (mode !== 2 || !current) return;
    setFeedback(`⏭️ Overgeslagen. Dit was: ${current.name}.`, false);
    draw();
    drawRing(current.x, current.y, 22, "rgba(0, 160, 0, 0.90)");
    drawDot(current.x, current.y, 8, "rgba(0,160,0,0.90)");
  }

  checkBtn.addEventListener("click", checkTyped);
  skipBtn.addEventListener("click", skipTyped);
  answerInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkTyped();
  });

})();
</script>
</body>
</html>
