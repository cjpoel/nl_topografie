<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hi! – Topografie oefenen</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrap">
    <h1>🎯 Kies een topografie-toets</h1>

    <div class="grid">

      <a class="card" href="play.html?set=noord">
        <img class="thumb" src="noord_schoon2.png?v=20260227-1" alt="Noord Nederland kaart">
        <div class="card-content">
          <p class="title">Noord-Nederland</p>
          <p class="desc">Friesland • Groningen • Drenthe</p>
        </div>
      </a>

      <a class="card" href="play.html?set=oost">
        <img class="thumb" src="oost_schoon4.png?v=20260227-1" alt="Oost Nederland kaart">
        <div class="card-content">
          <p class="title">Oost-Nederland</p>
          <p class="desc">Flevoland • Overijssel • Gelderland</p>
        </div>
      </a>

      <a class="card" href="play.html?set=zuid">
        <img class="thumb" src="zuid_schoon3.png?v=20260227-1" alt="Zuid Nederland kaart">
        <div class="card-content">
          <p class="title">Zuid-Nederland</p>
          <p class="desc">Utrecht • Noord-Brabant • Limburg</p>
        </div>
      </a>

    </div>

    <div class="hint">
      Tip: voeg deze pagina toe aan het beginscherm van de iPad voor snelle toegang.
    </div>
  </div>
</body>
</html>
