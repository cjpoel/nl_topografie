<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gijs – Oefenen</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    body{margin:0;background:#f6f7fb;color:#111;}
    .wrap{max-width:900px;margin:0 auto;padding:18px;}
    h1{margin:0 0 14px;font-size:22px;}
    .grid{display:grid;gap:12px;}
    @media (min-width:700px){.grid{grid-template-columns:1fr 1fr;}}
    a.card{
      display:block; text-decoration:none; color:inherit;
      background:#fff;border-radius:16px;padding:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.06);
      border:1px solid #eef1fb;
    }
    .title{font-size:18px;font-weight:800;margin:0 0 6px;}
    .desc{margin:0;color:#444;line-height:1.4;}
    .hint{margin-top:14px;color:#555;font-size:12px;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Gijs – Kies een toets</h1>

    <div class="grid">
      <a class="card" href="noord.html">
        <p class="title">Noord-Nederland</p>
        <p class="desc">Friesland • Groningen • Drenthe</p>
      </a>

      <a class="card" href="oost.html">
        <p class="title">Oost-Nederland</p>
        <p class="desc">Flevoland • Overijssel • Gelderland</p>
      </a>
    </div>

    <div class="hint">
      Tip: open deze pagina op de iPad en kies “Zet op beginscherm”.
    </div>
  </div>
</body>
</html>
